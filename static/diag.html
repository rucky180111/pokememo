<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>対戦メモ 診断</title>
<style>
body { font: 15px/1.6 system-ui, -apple-system, sans-serif; margin: 16px; color: #222; background: #fff; }
h1 { font-size: 18px; margin: 0 0 8px; }
li { margin: 4px 0; word-break: break-all; }
.ok { color: #1a7f37; } .ng { color: #c62828; font-weight: 700; } .mu { color: #666; }
button { font-size: 15px; padding: 8px 14px; margin: 6px 6px 0 0; }
</style>
</head>
<body>
<h1>対戦メモ 診断ページ</h1>
<p class="mu">この画面のスクショを送ってください。記録したデータは消しません。</p>
<ol id="out"></ol>
<button id="fix">アプリの一時ファイルを消す (記録は消えません)</button>
<button onclick="location.href='./'">アプリを開く</button>
<script>
var out = document.getElementById('out');
function line(ok, label, detail) {
  var li = document.createElement('li');
  li.innerHTML = '<span class="' + (ok === true ? 'ok' : ok === false ? 'ng' : 'mu') + '">' + (ok === true ? 'OK' : ok === false ? 'NG' : '・') + '</span> ' + label + (detail ? ' <span class="mu">' + String(detail).replace(/</g, '&lt;') + '</span>' : '');
  out.appendChild(li);
}
var t0 = Date.now();
line(null, '端末', navigator.userAgent);
line(null, '診断ページの版', '__VERSION__');
function step(label, p, ms) {
  return new Promise(function (resolve) {
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; line(false, label, (ms / 1000) + '秒たっても終わらない'); resolve(null); } }, ms);
    Promise.resolve().then(p).then(function (v) { if (done) return; done = true; clearTimeout(t); line(true, label, v); resolve(v); }, function (e) { if (done) return; done = true; clearTimeout(t); line(false, label, (e && (e.message || e.name)) || e); resolve(null); });
  });
}
(async function () {
  await step('Service Worker', function () {
    if (!navigator.serviceWorker) return '非対応';
    return navigator.serviceWorker.getRegistrations().then(function (rs) { return rs.length + '件 ' + rs.map(function (r) { return (r.active && r.active.scriptURL.split('/').pop()) || '?'; }).join(', '); });
  }, 5000);
  await step('キャッシュ', function () { return window.caches ? caches.keys().then(function (k) { return k.join(', ') || 'なし'; }) : '非対応'; }, 5000);
  await step('最新のアプリの版 (サーバー)', function () { return fetch('./index.html?d=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); }).then(function (t) { var m = /app\.js\?v=([\w]+)/.exec(t); return m ? m[1] : '不明'; }); }, 10000);
  await step('保存領域 (IndexedDB) を開く', function () {
    return new Promise(function (res, rej) {
      var s = Date.now();
      var r = indexedDB.open('pokememo', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () {
        var db = r.result;
        try {
          var tx = db.transaction('kv', 'readonly');
          var c = tx.objectStore('kv').count();
          c.onsuccess = function () { res((Date.now() - s) + 'ms / 記録 ' + c.result + '件'); db.close(); };
          c.onerror = function () { rej(c.error); };
        } catch (e) { rej(e); }
      };
      r.onerror = function () { rej(r.error); };
      r.onblocked = function () { line(null, '保存領域', 'ほかの画面が開いたままのため待っています'); };
    });
  }, 10000);
  await step('アプリ本体 (app.js) の読み込みと実行', function () {
    return new Promise(function (res, rej) {
      var f = document.createElement('iframe');
      f.style.cssText = 'width:1px;height:1px;border:0;position:absolute;left:-9px';
      f.src = './index.html?diag=' + Date.now();
      var s = Date.now();
      var iv = setInterval(function () {
        try {
          var w = f.contentWindow, d = f.contentDocument;
          if (!w || !d) return;
          if (!w.__pmDiagHooked && w.addEventListener) { w.__pmDiagHooked = true; w.__pmErrs = []; w.addEventListener('error', function (e) { w.__pmErrs.push((e.message || 'error') + (e.filename ? ' @' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ':' + e.colno : '')); }); w.addEventListener('unhandledrejection', function (e) { w.__pmErrs.push('promise: ' + (e.reason && (e.reason.message || e.reason))); }); }
          if (d.querySelector('.bottomnav')) { clearInterval(iv); res('画面が出た (' + (Date.now() - s) + 'ms)'); }
          else if (w.__pmErrs && w.__pmErrs.length) { clearInterval(iv); rej(new Error(w.__pmErrs.join(' / '))); }
          else if (Date.now() - s > 20000) { clearInterval(iv); rej(new Error('20秒たっても画面が出ない。中身: ' + (d.body ? d.body.innerText.slice(0, 120) : '?') + ' / 版 ' + (w.__pmVersion || '?') + ' / 起動済み ' + !!w.__pmBooted)); }
        } catch (e) { clearInterval(iv); rej(e); }
      }, 100);
      document.body.appendChild(f);
    });
  }, 25000);
  line(null, '診断終了', (Date.now() - t0) + 'ms');
})();
document.getElementById('fix').onclick = function () {
  var tasks = [];
  if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
  if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
  Promise.all(tasks).then(function () { alert('消しました。「アプリを開く」を押してください'); }, function (e) { alert('失敗: ' + e); });
};
</script>
</body>
</html>
