<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>対戦メモ</title>
<meta name="description" content="ポケモンチャンピオンズ向けの対戦メモ・ダメージ計算ツール (非公式)">
<meta name="theme-color" content="#171b21" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="対戦メモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./app.css?v=de4315f31e">
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<noscript>このアプリは JavaScript を有効にして使ってください。</noscript>
<script>
window.__pmVersion = 'de4315f31e';
// 起動の見張り: 起動中のエラーや、一定時間たっても始まらないときに、原因と立て直しのボタンを出す
(function () {
  var errs = [];
  function note(m) { errs.push(String(m || '').slice(0, 300)); }
  function soon() { setTimeout(function () { window.__pmBootFail && window.__pmBootFail('起動中にエラーが起きました'); }, 4000); }
  window.addEventListener('error', function (e) { if (!window.__pmBooted) { note(e.message + (e.filename ? ' @' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ':' + e.colno : '')); soon(); } });
  window.addEventListener('unhandledrejection', function (e) { if (!window.__pmBooted) { note(e.reason && (e.reason.stack || e.reason.message || e.reason)); soon(); } });
  window.__pmBootFail = function (why) {
    if (window.__pmBooted) return;
    var el = document.getElementById('app');
    if (!el) return;
    el.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:16px;font:15px/1.6 system-ui,sans-serif">' +
      '<h3 style="margin:0 0 8px">起動できませんでした</h3>' +
      '<p>記録したデータは端末に残っています。下のボタンを順に試してください。</p>' +
      '<p style="color:#a33;font-size:13px;white-space:pre-wrap"></p>' +
      '<p><button id="pm-r1" style="font-size:15px;padding:8px 14px;margin:4px 4px 4px 0">再読み込み</button>' +
      '<button id="pm-r2" style="font-size:15px;padding:8px 14px;margin:4px 0">アプリを最新にして再読み込み</button>' +
      '<button id="pm-r3" style="font-size:15px;padding:8px 14px;margin:4px 0 4px 4px">診断ページ</button></p>' +
      '<p style="font-size:13px;color:#666">それでも直らないときは、アプリ (Safari) を完全に終了するか、端末を再起動してから開いてください。「アプリを最新にして再読み込み」はアプリ本体の一時ファイルだけを消し、記録は消しません。</p></div>';
    el.querySelector('p[style*="a33"]').textContent = [why].concat(errs).filter(Boolean).join('\n');
    document.getElementById('pm-r1').onclick = function () { location.reload(); };
    document.getElementById('pm-r3').onclick = function () { location.href = './diag.html'; };
    document.getElementById('pm-r2').onclick = function () {
      var tasks = [];
      if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(tasks).catch(function () {}).then(function () { location.reload(); });
    };
  };
  setTimeout(function () { window.__pmBootFail('起動に時間がかかりすぎています (10秒)'); }, 10000);
  // 起動が2回続けて最後まで行かなかったとき (固まる・落ちる) は、アプリ本体を動かさずに立て直しの画面を出す
  var tries = 0;
  try { tries = +(localStorage.getItem('pm:bootTry') || 0); localStorage.setItem('pm:bootTry', String(tries + 1)); } catch (e) {}
  if (tries >= 2 && !/[?&](safe|go)\b/.test(location.search)) {
    window.__pmRescue = true;
    var el = document.getElementById('app');
    el.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:16px;font:15px/1.6 system-ui,sans-serif">' +
      '<h3 style="margin:0 0 8px">前回までの起動が完了しませんでした</h3>' +
      '<p>記録は端末に残っています。上から順に試してください。</p>' +
      '<p><button id="pm-s1" style="font-size:15px;padding:8px 14px;margin:4px 0;display:block">① 同期を止めて起動する</button>' +
      '<button id="pm-s2" style="font-size:15px;padding:8px 14px;margin:4px 0;display:block">② アプリを最新にして起動する (一時ファイルだけ消す)</button>' +
      '<button id="pm-s3" style="font-size:15px;padding:8px 14px;margin:4px 0;display:block">③ 診断ページを開く (結果をスクショで送ってください)</button>' +
      '<button id="pm-s4" style="font-size:15px;padding:8px 14px;margin:4px 0;display:block">ふつうに起動する</button></p></div>';
    var clearTry = function () { try { localStorage.removeItem('pm:bootTry'); } catch (e) {} };
    document.getElementById('pm-s1').onclick = function () { location.href = './?safe=1'; };
    document.getElementById('pm-s2').onclick = function () {
      clearTry();
      var tasks = [];
      if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(tasks).catch(function () {}).then(function () { location.href = './?go=' + Date.now(); });
    };
    document.getElementById('pm-s3').onclick = function () { location.href = './diag.html'; };
    document.getElementById('pm-s4').onclick = function () { clearTry(); location.href = './?go=' + Date.now(); };
  }
})();
</script>
<script src="./app.js?v=de4315f31e" defer></script>
</body>
</html>
